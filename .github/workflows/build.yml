name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ci.keystore"
          fi

      - name: Build debug APK
        env:
          LANE_KEYSTORE: ${{ runner.temp }}/ci.keystore
          LANE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LANE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LANE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon -PversionCode=${{ github.run_number }}

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "lane-widget-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: lane-widget-apk
          path: lane-widget-${{ github.run_number }}.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ github.run_number }}"
          gh release create "$TAG" "lane-widget-${{ github.run_number }}.apk" \
            --repo "${{ github.repository }}" \
            --title "Lane Widget $TAG" \
            --notes "Сборка ${{ github.run_number }}" \
            --latest
